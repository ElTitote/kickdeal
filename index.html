<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kickdeal</title>
  <link rel="stylesheet" href="main Kick.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
 
<body>
<header class="header">
    <div class="limitador header-container">
      <a href="index.html" class="logo-link">
        <img class="logo" src="no-bg.png" alt="Kickdeal Logo">
      </a>

      <form class="busqueda" action="#" method="GET">
        <input type="search" placeholder="Buscar productos, marcas y más..." required>
        <button type="submit" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>

      <div class="registrarse">
        <a class="btn-login" href="login.html">
          <i class="fa-regular fa-user"></i>
          <span>Iniciar Sesión</span>
        </a>
      </div>
    </div>
  </header>


  <main class="limitador">
    <section class="slider-container">
      <div class="slider">
        <div class="slide" id="imagen1">
          <img src="Publi1.png" alt="Imagen 1">
        </div>
        <div class="slide" id="imagen2">
          <img src="Publi2.png" alt="Imagen 2">
        </div>
        <div class="slide" id="imagen3">
          <img src="Publi3.png" alt="Imagen 3">
        </div>
        <div class="slide" id="imagen4">
          <img src="Publi4.png" alt="Imagen 4">
        </div>
      </div>

      <div class="points">
        <a class="puntos" href="#imagen1"></a>
        <a class="puntos" href="#imagen2"></a>
        <a class="puntos" href="#imagen3"></a>
        <a class="puntos" href="#imagen4"></a>
      </div>
    </section>

    <section class="trabaja-section">
      <div class="trab">
        <h2>Trabaja con nosotros</h2>
        <p>¡Rellena este formulario y te enviaremos nuestras vacantes disponibles, para que trabajes e innoves para nosotros y los clientes!</p>
        <a href="formulario.html" class="btn-formu">Ir al Formulario</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="limitador footer-content">
      <div class="footer-brand">
        <h3>Kickdeal</h3>
        <p>Impulsaremos tus ideas al maximo</p>
      </div>
      
      <div class="copyright">
      <p>&copy; 2025 Kickdeal. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
